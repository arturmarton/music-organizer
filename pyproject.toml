[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "music-organizer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["mutagen", "Pillow", "yt-dlp[default]"]

[project.scripts]
music = "music_organizer.cli:main"

[tool.setuptools.packages.find]
include = ["music_organizer*"]
